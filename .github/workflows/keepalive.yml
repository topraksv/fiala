# Supabase's free plan pauses a project whose database saw little activity over
# seven days; its documentation puts the bar at "a few user requests to the
# database each day". The heartbeat used to run every third day, two requests a
# run, and two of the family's projects paused under it. It now runs three
# times a day and makes four database requests each time.
#
# Only status codes are echoed: a response body would put PostgREST output into
# a public Actions log. A paused project's host no longer resolves, so that
# case is named in the log instead of left as a curl error.
#
# GitHub disables a public repository's scheduled workflows after 60 days with
# no repository activity; docs/RELEASE.md says what to do then.
name: supabase-keepalive

on:
  schedule:
    # Off the hour: GitHub delays and sometimes drops schedules queued at :00.
    - cron: "17 5,13,21 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write and read the keep_alive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          host=${SUPABASE_URL#https://}
          if ! getent hosts "${host%%/*}" >/dev/null; then
            echo "::error::The project's host does not resolve: Supabase has paused it. Restore it from the dashboard (Project > Restore)."
            exit 1
          fi
          call() {
            curl -sS --retry 2 --max-time 30 -o /tmp/body.json -w "%{http_code}" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$@"
          }
          status=$(call -X POST "$SUPABASE_URL/rest/v1/keep_alive?on_conflict=id" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
            -d "[{\"id\": 1, \"pinged_at\": \"$(date -u +%FT%TZ)\"}]")
          echo "write: $status"
          [ "$status" = "201" ] || [ "$status" = "200" ]
          for attempt in 1 2 3; do
            status=$(call "$SUPABASE_URL/rest/v1/keep_alive?select=id,pinged_at&id=eq.1")
            echo "read $attempt: $status"
            [ "$status" = "200" ]
            grep -q '"id"' /tmp/body.json
          done
